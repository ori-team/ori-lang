name: One-time documentation catalog finalization

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: documentation-catalog-finalization
  cancel-in-progress: false

jobs:
  finalize:
    if: github.head_ref == 'agent/documentation-framework-refactor'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-framework-refactor
          fetch-depth: 0

      - name: Finalize catalog
        run: python tools/docs/finalize_catalog.py

      - name: Validate documentation
        run: python tools/docs/check_docs.py

      - name: Commit final catalog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize historical migration metadata"
          git push origin HEAD:agent/documentation-framework-refactor
