name: Cleanup merged branches

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/cleanup-merged-branches.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Verify and delete merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            "agent/documentation-framework-refactor"
            "cursor/ori-book-pdf"
            "execute-plan/5b7bfbb0-pr-1-maturity-5-plan-lock-in"
            "execute-plan/b927af56-pr-10-phase-os-scaffolding-last"
            "tmp/branch-cleanup"
          )

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          for branch in "${branches[@]}"; do
            if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              echo "$branch already absent"
              continue
            fi

            if ! git merge-base --is-ancestor "refs/remotes/origin/$branch" "refs/remotes/origin/master"; then
              echo "Refusing to delete unmerged branch: $branch" >&2
              exit 1
            fi
          done

          for branch in "${branches[@]}"; do
            if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              encoded_branch="${branch//\//%2F}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_branch}"
              echo "Deleted $branch"
            fi
          done
