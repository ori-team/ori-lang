name: One-time documentation history migration

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: documentation-history-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.head_ref == 'agent/documentation-framework-refactor'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-framework-refactor
          fetch-depth: 0

      - name: Apply migration
        run: python tools/docs/apply_history_migration.py

      - name: Validate migrated documentation
        run: python tools/docs/check_docs.py

      - name: Commit migration
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Migration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: complete historical documentation migration"
          git push origin HEAD:agent/documentation-framework-refactor
