name: One-time documentation changelog update

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: documentation-changelog-migration
  cancel-in-progress: false

jobs:
  update:
    if: github.head_ref == 'agent/documentation-framework-refactor'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-framework-refactor
          fetch-depth: 0

      - name: Insert documentation framework changelog entry
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          marker = "- **Canonical documentation framework.**"
          if marker in text:
              raise SystemExit(0)

          entry = """### Documentation

- **Canonical documentation framework.** Established `PROJECT_START.md`, a focused operational `AGENTS.md`, the documentation ATLAS and machine-readable catalog, product/architecture/implementation/quality/security/governance/operations domains, numbered ADRs, RFC and ExecPlan templates, archive rules, AI context-pack routing, and documentation CI. Active project documentation now uses version `0.3.8`, public repository identity and security metadata are corrected, and the implementation backlog contains only open or deliberately deferred outcomes.

"""
          anchor = "## [Unreleased]\n\n"
          if anchor not in text:
              raise SystemExit("CHANGELOG.md has no [Unreleased] anchor")
          path.write_text(text.replace(anchor, anchor + entry, 1), encoding="utf-8")
          PY

      - name: Commit when changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Changelog entry already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: record documentation framework"
          git push origin HEAD:agent/documentation-framework-refactor
