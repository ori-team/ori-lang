name: release

# Every supported native package is a required artifact. Tag releases are
# published only after package smoke, checksums, SBOM generation, and SLSA
# build-provenance attestation succeed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag at the selected commit (for example v0.3.8)"
        required: false
        type: string
      publish:
        description: "Publish the existing tag after all package gates pass"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: package-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            shell: sh
            archive_ext: tar.gz
            build_deb: "1"
          - name: x86_64-pc-windows-msvc
            os: windows-latest
            shell: powershell
            archive_ext: zip
            build_deb: "0"
          - name: aarch64-apple-darwin
            os: macos-15
            shell: sh
            archive_ext: tar.gz
            build_deb: "0"
          - name: x86_64-apple-darwin
            os: macos-15-intel
            shell: sh
            archive_ext: tar.gz
            build_deb: "0"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -eu
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustc -Vv
          cargo -V

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential dpkg-dev binutils libc6-dev gcc g++

      - name: Package and smoke (Windows JIT + AOT)
        if: matrix.shell == 'powershell'
        shell: pwsh
        env:
          ORI_USE_SYSTEM_LINKER: "1"
          CARGO_TERM_COLOR: always
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.tag }}") {
            $tag = "${{ inputs.tag }}".Trim()
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') {
            $version = Select-String -Path compiler\Cargo.toml -Pattern '^version = "([^"]+)"' |
              Select-Object -First 1
            $tag = "v" + $version.Matches[0].Groups[1].Value
          }
          if ($tag -notmatch '^v') { $tag = "v$tag" }
          $dist = Join-Path $env:GITHUB_WORKSPACE "compiler\target\dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $root = Join-Path $dist "ori-${{ matrix.name }}"
          $archive = Join-Path $dist "ori-$tag-${{ matrix.name }}.zip"
          & "$env:GITHUB_WORKSPACE\tools\package_native_release.ps1" `
            -PackageRoot $root -ArchivePath $archive -Overwrite
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "required archive missing: $archive"
          }

      - name: Package and smoke (Unix JIT + AOT)
        if: matrix.shell == 'sh'
        shell: bash
        env:
          ORI_USE_SYSTEM_LINKER: "1"
          CARGO_TERM_COLOR: always
        run: |
          set -eu
          set -o pipefail
          tag="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          fi
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) tag="v$(awk '/^version = / { gsub(/\"/, "", $3); print $3; exit }' compiler/Cargo.toml)" ;;
          esac
          version=${tag#v}
          mkdir -p compiler/target/dist
          root="compiler/target/dist/ori-${{ matrix.name }}"
          archive="compiler/target/dist/ori-${tag}-${{ matrix.name }}.tar.gz"
          if [ "${{ matrix.build_deb }}" = "1" ]; then
            bash tools/package_native_release.sh \
              --package-root "$root" \
              --archive "$archive" \
              --deb "compiler/target/dist/ori_${version}_amd64.deb" \
              --force
            test -f "compiler/target/dist/ori_${version}_amd64.deb"
          else
            bash tools/package_native_release.sh \
              --package-root "$root" \
              --archive "$archive" \
              --skip-deb \
              --force
          fi
          test -f "$archive"

      - name: Upload package diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-diagnostics-${{ matrix.name }}
          path: compiler/target/dist
          if-no-files-found: ignore

      - name: Upload required package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ori-${{ matrix.name }}
          path: |
            compiler/target/dist/ori-*-${{ matrix.name }}.${{ matrix.archive_ext }}
            compiler/target/dist/ori_*_amd64.deb
          if-no-files-found: error

  publish:
    name: publish-release
    needs: package
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve and validate immutable tag
        id: tag
        shell: bash
        run: |
          set -eu
          tag="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          fi
          case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "invalid release tag: $tag" >&2; exit 2 ;; esac
          tagged_commit=$(git rev-list -n 1 "$tag")
          test "$tagged_commit" = "${{ github.sha }}"
          commit_epoch=$(git show -s --format=%ct "$tagged_commit")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "commit_epoch=$commit_epoch" >> "$GITHUB_OUTPUT"

      - name: Download every required platform artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: ori-*
          merge-multiple: true

      - name: Require the complete release matrix
        shell: bash
        run: |
          set -eu
          tag="${{ steps.tag.outputs.tag }}"
          version="${{ steps.tag.outputs.version }}"
          test -f "dist/ori-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          test -f "dist/ori-${tag}-x86_64-pc-windows-msvc.zip"
          test -f "dist/ori-${tag}-aarch64-apple-darwin.tar.gz"
          test -f "dist/ori-${tag}-x86_64-apple-darwin.tar.gz"
          test -f "dist/ori_${version}_amd64.deb"

      - name: Generate SPDX SBOM and SHA-256 manifest
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.tag.outputs.commit_epoch }}
        run: |
          set -eu
          tag="${{ steps.tag.outputs.tag }}"
          python3 tools/release/generate_sbom.py \
            --lock compiler/Cargo.lock \
            --output "dist/ori-${tag}.spdx.json" \
            --name "Ori ${tag} Cargo dependency SBOM"
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS
          test -s SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@62fc1d596301d0ab9914e1fec14dc5c8d93f65cd # v3.2.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.spdx.json
            dist/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Ori ${{ steps.tag.outputs.tag }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Native packages for all supported desktop targets. Every release
            includes `SHA256SUMS`, an SPDX SBOM, and GitHub build provenance.

            AOT (`ori compile` and `ori test`) requires the platform linker.
            JIT (`ori run`) uses the packaged runtime without Rust.
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.spdx.json
            dist/SHA256SUMS
