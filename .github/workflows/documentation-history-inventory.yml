name: One-time documentation history inventory

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: documentation-history-inventory
  cancel-in-progress: false

jobs:
  inventory:
    if: github.head_ref == 'agent/documentation-framework-refactor'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-framework-refactor
          fetch-depth: 0

      - name: Generate inventory
        run: python tools/docs/inventory_history.py

      - name: Commit inventory when changed
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain .ai/generated/documentation-history-inventory.json)" ]]; then
            echo "Inventory already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ai/generated/documentation-history-inventory.json
          git commit -m "docs: inventory historical documentation"
          git push origin HEAD:agent/documentation-framework-refactor
