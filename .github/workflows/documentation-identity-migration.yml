name: One-time documentation identity migration

on:
  push:
    branches:
      - agent/documentation-framework-refactor
    paths-ignore:
      - ".github/workflows/documentation-identity-migration.yml.disabled"

permissions:
  contents: write

concurrency:
  group: documentation-identity-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-framework-refactor
          fetch-depth: 0

      - name: Apply scoped text migration
        run: python tools/docs/remove_legacy_identity.py

      - name: Commit migration when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No identity migration changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: remove retired project identity"
          git push origin HEAD:agent/documentation-framework-refactor
